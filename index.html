:root{--h5:#15803d;--h6:#166534;--h7:#14532d;--h8:#0f3d22;--e4:#e0b94a;--e5:#c9a227;--e6:#a8841c;

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
html,body{background:var(--bg);color:var(--tx);font-family:Inter,system-ui,sans-serif;font-size:15px;line-height:1.5;}
img{display:block;max-width:100%;}
a{text-decoration:none;color:inherit;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit;}
.app{max-width:640px;margin:0 auto;min-height:100vh;padding-bottom:80px;}

main{padding:16px;}
.card{background:#fff;border-radius:16px;box-shadow:0 1px 3px rgba(0,0,0,.05);border:1px solid #f1f3f4;}
.banner{background:linear-gradient(135deg,var(--h7),var(--h6) 60%,var(--h5));color:#fff;padding:20px;border-radius:18px;position:relative;overflow:hidden;box-shadow:0 6px 20px rgba(20,83,45,.25);}
.banner::before{content:'';position:absolute;right:-30px;top:-30px;width:130px;height:130px;border-radius:50%;background:rgba(201,162,39,.22);}
.banner small{color:var(--e4);font-weight:600;font-size:12px;}
.banner h2{margin:6px 0 4px;font-size:20px;line-height:1.25;position:relative;z-index:1;}
.banner p{margin:0 0 14px;font-size:13px;opacity:.85;position:relative;z-index:1;}
.btn{display:inline-block;padding:10px 16px;border-radius:12px;font-weight:700;font-size:13px;text-align:center;transition:.15s;border:none;cursor:pointer;}
.bp{background:var(--h6);color:#fff;}
.bp:active{background:var(--h7);}
.bg{background:var(--e5);color:var(--h8);}
.bg:active{background:var(--e6);}
.bo{background:transparent;border:2px solid var(--h6);color:var(--h7);}

.bs{padding:7px 12px;font-size:12px;}

.pkg .price{margin:8px 0 12px;font-size:16px;font-weight:800;color:var(--h7);}

.item p{margin:0;font-size:12px;color:var(--mt);}
.ig{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;}
.info{padding:10px;border-radius:12px;background:#fff;border:1px solid #f1f3f4;}

nav.bn{position:fixed;bottom:0;left:0;right:0;z-index:40;background:#fff;border-top:1px solid var(--bd);box-shadow:0 -4px 12px rgba(0,0,0,.05);}

.ng a.on{color:var(--h6);}

label{display:block;font-size:12px;font-weight:600;color:#4b5563;margin-bottom:4px;}
input,select,textarea{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--bd);background:#fff;font-family:inherit;font-size:14px;color:var(--tx);outline:none;}

textarea{resize:vertical;min-height:60px;}

.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.ph{font-size:17px;font-weight:800;color:var(--h7);margin:0 0 4px;}
.ps{font-size:12px;color:var(--mt);margin:0 0 14px;}
.mb{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;}
.mb img,.mb video{max-width:100%;max-height:80vh;border-radius:14px;}
.ctr{text-align:center;}

.sp{padding:32px 0;text-align:center;color:var(--mt);font-size:13px;}
.bd{display:inline-block;padding:2px 8px;border-radius:999px;font-size:10px;font-weight:700;}
.bd.g{background:rgba(201,162,39,.15);color:var(--e6);}
.bd.h{background:#f0f9f4;color:var(--h7);}
.bd.r{background:#fee2e2;color:#b91c1c;}
.empty{padding:32px 16px;text-align:center;color:var(--mt);font-size:13px;}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.stat{padding:14px;border-radius:14px;background:#fff;border:1px solid #f1f3f4;}
.stat .num{font-size:22px;font-weight:800;color:var(--h7);}
.stat .lbl{font-size:11px;color:var(--mt);margin-top:2px;}
.tst{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:999px;font-size:12px;z-index:200;box-shadow:0 6px 20px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:.2s;}
.tst.on{opacity:1;}
.amg{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.amg a{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 10px;background:#fff;border:1px solid #f1f3f4;border-radius:14px;font-size:12px;font-weight:600;color:var(--h7);}
.amg a:active{background:#f0f9f4;}
.amg svg{width:24px;height:24px;color:var(--h6);}
.tb{display:flex;gap:8px;margin-bottom:12px;align-items:center;}
.tb input{flex:1;}
.fc{padding:16px;margin-bottom:12px;}
.db{background:#fee2e2;color:#b91c1c;padding:6px 10px;border-radius:8px;font-size:11px;font-weight:700;}
</style>

/* ============ STATE ============ */
let ST=null,user=null,adm=null;

/* ============ HELPERS ============ */
const rp=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(n||0);
const tg=s=>s?new Date(s).toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'}):'-';
const ts=s=>s?new Date(s).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'}):'-';
const es=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const wa=(n,m)=>`https://wa.me/${(n||'').replace(/\D/g,'')}?text=${encodeURIComponent(m||'')}`;
function toast(m){const t=document.getElementById('tst');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2000);}

/* ============ DATA LAYER ============ */
async function sel(t,f){
 if(DEMO){let a=JSON.parse(JSON.stringify(D[t]||[]));
  if(f?.eq)for(const[k,v]of Object.entries(f.eq))a=a.filter(r=>r[k]===v);
  if(f?.gte)for(const[k,v]of Object.entries(f.gte))a=a.filter(r=>r[k]>=v);
  if(f?.order)a.sort((x,y)=>(x[f.order.c]>y[f.order.c]?1:-1)*(f.order.a===false?-1:1));
  if(f?.limit)a=a.slice(0,f.limit);return a;}
 let q=sb.from(t).select('*');
 if(f?.eq)for(const[k,v]of Object.entries(f.eq))q=q.eq(k,v);
 if(f?.gte)for(const[k,v]of Object.entries(f.gte))q=q.gte(k,v);
 if(f?.order)q=q.order(f.order.c,{ascending:f.order.a!==false});
 if(f?.limit)q=q.limit(f.limit);
 const{data}=await q;return data||[];
}
async function ins(t,r){
 if(DEMO){const n={...r,id:r.id||('x'+Date.now()),created_at:new Date().toISOString()};D[t]=D[t]||[];D[t].push(n);return{data:n,error:null};}
 return sb.from(t).insert(r).select().single();
}
async function upd(t,m,p){
 if(DEMO){const a=D[t]||[];const x=a.find(r=>Object.entries(m).every(([k,v])=>r[k]===v));if(x)Object.assign(x,p);return{data:x,error:null};}
 let q=sb.from(t).update(p);
 for(const[k,v]of Object.entries(m))q=q.eq(k,v);
 return q.select().single();
}
async function del(t,m){
 if(DEMO){D[t]=(D[t]||[]).filter(r=>!Object.entries(m).every(([k,v])=>r[k]===v));return{error:null};}
 let q=sb.from(t).delete();
 for(const[k,v]of Object.entries(m))q=q.eq(k,v);
 return q;
}
async function loadST(){
 if(ST)return ST;
 if(DEMO){ST=D.settings;return ST;}
 const{data}=await sb.from('bureau_settings').select('*').eq('id',1).maybeSingle();
 ST=data||D.settings;return ST;
}
async function loadUser(){
 if(DEMO){user=JSON.parse(localStorage.getItem('du')||'null');adm=localStorage.getItem('da')==='1'?{email:'admin@demo'}:null;return;}
 const{data}=await sb.auth.getUser();user=data?.user||null;adm=null;
 if(user){const{data:p}=await sb.from('profiles').select('role').eq('id',user.id).maybeSingle();if(p?.role==='admin')adm=user;}
}

const R={'#/':pBeranda,'#/paket':pPaket,'#/daftar':pDaftar,'#/jadwal':pJadwal,'#/galeri':pGaleri,'#/pengumuman':pPengumuman,'#/profil':pProfilBiro,'#/bantuan':pBantuan,'#/login':pLogin,'#/profil-jamaah':pProfilJamaah,'#/admin':pAdminLogin,'#/admin/dash':pAdminDash,'#/admin/paket':pAdminPaket,'#/admin/pendaftaran':pAdminPendaftaran,'#/admin/jadwal':pAdminJadwal,'#/admin/galeri':pAdminGaleri,'#/admin/pengumuman':pAdminPengumuman,'#/admin/pengaturan':pAdminPengaturan};

async function route(){
 const h=location.hash||'#/';
 await loadUser();await loadST();
 const b=document.getElementById('btnLoginTop');
 if(user||adm){b.textContent=adm?'Admin':'Profil';b.onclick=()=>location.hash=adm?'#/admin/dash':'#/profil-jamaah';}

 const s=ST;
 const pk=await sel('packages',{eq:{is_active:true},order:{c:'created_at',a:false},limit:3});

 const dp=await sel('departures',{gte:{departure_date:new Date().toISOString().slice(0,10)},order:{c:'departure_date',a:true},limit:1});
 const nx=dp[0];
 sc(`
 <div class="banner"><small>Assalamualaikum 👋</small><h2>Wujudkan Umroh Impian Bersama Kami</h2><p>Bimbingan penuh dari keberangkatan hingga kembali ke tanah air.</p><a href="#/daftar" class="btn bg">Daftar Sekarang</a></div>

/* ============ ADMIN: KELOLA PAKET ============ */
async function pAdminPaket(){
 const l=await sel('packages',{order:{c:'created_at',a:false}});
 sc(`<h2 class="ph">Kelola Paket</h2>
 <button class="btn bp bb" id="add" style="margin-bottom:12px">+ Tambah Paket</button>
 <div id="lp"></div>`);
 renderList();
 function renderList(){
  document.getElementById('lp').innerHTML=l.map(p=>`<div class="card" style="padding:12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px">
  <div style="flex:1;min-width:0"><b style="font-size:13px">${es(p.name)}</b><p style="margin:2px 0 0;font-size:11px;color:var(--mt)">${rp(p.price)} • ${p.quota} kuota • ${p.is_active?'✅ Aktif':'❌ Nonaktif'}</p></div>
  <button class="btn bo bs" data-edit="${p.id}">Edit</button>
  <button class="db" data-del="${p.id}">Hapus</button>
  </div>`).join('')||'<div class="empty">Belum ada paket.</div>';
  document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editP(l.find(x=>x.id===b.dataset.edit)));
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
   if(!confirm('Hapus paket ini?'))return;
   await del('packages',{id:b.dataset.del});
   toast('Terhapus');pAdminPaket();
  });
 }
 function editP(p){
  const isNew=!p;p=p||{};
  const m=document.getElementById('modal');
  m.innerHTML=`<div class="mb" style="align-items:flex-end"><div style="background:#fff;border-radius:20px 20px 0 0;padding:16px;width:100%;max-height:85vh;overflow:auto">
  <h3 style="margin:0 0 12px;color:var(--h7)">${isNew?'Tambah':'Edit'} Paket</h3>
  <div class="field"><label>Nama Paket</label><input id="i_name" value="${es(p.name||'')}"></div>
  <div class="r2"><div class="field"><label>Harga</label><input id="i_price" type="number" value="${p.price||0}"></div>
  <div class="field"><label>Durasi (hari)</label><input id="i_dur" type="number" value="${p.duration_days||9}"></div></div>
  <div class="r2"><div class="field"><label>Tgl Berangkat</label><input id="i_dep" type="date" value="${p.departure_date||''}"></div>
  <div class="field"><label>Kuota</label><input id="i_q" type="number" value="${p.quota||45}"></div></div>
  <div class="field"><label>Maskapai</label><input id="i_air" value="${es(p.airline||'')}"></div>
  <div class="field"><label>Hotel Makkah</label><input id="i_hm" value="${es(p.hotel_makkah||'')}"></div>
  <div class="field"><label>Hotel Madinah</label><input id="i_hd" value="${es(p.hotel_madinah||'')}"></div>
  <div class="field"><label>URL Foto</label><input id="i_img" value="${es(p.image_url||'')}"></div>
  <div class="field"><label>Aktif</label><select id="i_act"><option value="true" ${p.is_active!==false?'selected':''}>Ya</option><option value="false" ${p.is_active===false?'selected':''}>Tidak</option></select></div>
  <div style="display:flex;gap:8px;margin-top:8px">
  <button class="btn bo" style="flex:1" onclick="document.getElementById('modal').innerHTML=''">Batal</button>
  <button class="btn bp" style="flex:1" id="sv">Simpan</button>
  </div></div></div>`;
  document.getElementById('sv').onclick=async()=>{
   const row={
    name:document.getElementById('i_name').value,
    price:Number(document.getElementById('i_price').value)||0,
    duration_days:Number(document.getElementById('i_dur').value)||9,
    departure_date:document.getElementById('i_dep').value||null,
    quota:Number(document.getElementById('i_q').value)||45,
    airline:document.getElementById('i_air').value,
    hotel_makkah:document.getElementById('i_hm').value,
    hotel_madinah:document.getElementById('i_hd').value,
    image_url:document.getElementById('i_img').value,
    is_active:document.getElementById('i_act').value==='true'
   };
   if(!row.name){alert('Nama wajib diisi');return;}
   if(isNew) await ins('packages',row);
   else await upd('packages',{id:p.id},row);
   document.getElementById('modal').innerHTML='';
   toast('Tersimpan');pAdminPaket();
  };
 }
 document.getElementById('add').onclick=()=>editP(null);
}
